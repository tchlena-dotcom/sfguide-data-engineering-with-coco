name: PR Review

on:
  pull_request:
    paths:
      - "dbt/models/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dbt-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history is required: the dbt-review agent runs `git diff` against the PR base branch.
          fetch-depth: 0

      - name: Configure Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/connections.toml <<EOF
          [default]
          account = "${SNOWFLAKE_ACCOUNT}"
          user = "${SNOWFLAKE_USER}"
          password = "${SNOWFLAKE_PASSWORD}"
          EOF
          chmod 600 ~/.snowflake/connections.toml

      - name: Install CoCo CLI
        run: |
          curl -LsS https://ai.snowflake.com/static/cc-scripts/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run dbt-review agent
        run: |
          set +e
          cortex --print "Use the dbt-review agent to review the changes in this PR" \
            > review.md 2> cortex-error.log
          status=$?
          set -e
          echo "cortex exit code: $status"
          echo "----- cortex-error.log -----"; cat cortex-error.log
          echo "----- review.md -----"; cat review.md
          # Never post a blank comment: fall back to the error details.
          if [ ! -s review.md ] || ! grep -q '[^[:space:]]' review.md; then
            {
              echo "## dbt-review did not produce output"
              echo
              echo "\`cortex\` exited with code $status. Error output:"
              echo
              echo '```'
              tail -n 50 cortex-error.log
              echo '```'
            } > review.md
          fi
          
      - name: Post review comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review.md
